version = 1
SPDX-PackageName = "Glate"
SPDX-PackageSupplier = "Keshav Bhatt <keshavnrj@gmail.com>"
SPDX-PackageDownloadLocation = "https://github.com/keshavbhatt/glate-ng"

# Everything is GPL-3.0-or-later except the licensing module and the third-party files below.
[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2020-2026 Keshav Bhatt (Ktechpit) and contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# The licensing module: account, licence, evaluation, Pro-feature and allowance code.
[[annotations]]
path = [
    "modules/AccountAndLicense/**",
    "src/GlateLicenseConfig.h",
    "src/licenseservice.cpp",
    "src/licenseservice.h",
    "src/accountdialog.cpp",
    "src/accountdialog.h",
    "src/accountdialog.ui",
    "src/planscomparisiondialog.cpp",
    "src/planscomparisiondialog.h",
    "src/planscomparisiondialog.ui"
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Keshav Bhatt (Ktechpit)"
SPDX-License-Identifier = "LicenseRef-Ktechpit-Licensing-Module"

# KtechpitApps ("More apps from Ktechpit"), a subtree of github.com/keshavbhatt/ktechpit-apps (ADR-010).
[[annotations]]
path = "modules/KtechpitApps/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 Keshav Bhatt (Ktechpit)"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["src/waitingspinnerwidget.cpp", "src/waitingspinnerwidget.h"]
precedence = "override"
SPDX-FileCopyrightText = ["2012-2014 Alexander Turkin", "2014 William Hallatt", "2015 Jacob Dawid"]
SPDX-License-Identifier = "MIT"

# UI glyphs from Remix Icon (Apache-2.0 at the versions used: a 2020 snapshot, 2.5.0 and 4.6.0 for sparkling-line).
[[annotations]]
path = ["src/icons/*-line.png", "src/icons/*-fill.png", "src/icons/text.png"]
precedence = "override"
SPDX-FileCopyrightText = "Remix Design"
SPDX-License-Identifier = "Apache-2.0"

# The design mocks embed Lucide glyph paths in their helper script.
[[annotations]]
path = "DOCS/mocks/mock.js"
precedence = "override"
SPDX-FileCopyrightText = ["2026 Keshav Bhatt (Ktechpit)", "Lucide Contributors"]
SPDX-License-Identifier = "GPL-3.0-or-later AND ISC"
