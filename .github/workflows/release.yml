# A version tag (v1.2.3) becomes a GitHub release with the Windows portable build
# (DOCS/DECISIONS.md ADR-007). The snap for the tag goes to the stable channel through
# snap.yml; Flathub builds the tag itself through its x-checker-data.
name: Build and Release Artifacts

on:
  push:
    tags:
      - 'v*.*.*'
  # By hand: builds the artifacts of `tag` (or of the chosen branch, as a test) and,
  # for a tag, creates its release. Lets a release be rebuilt after a CI-only fix.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release, e.g. v1.2.3 (empty: test build of the branch, no release)'
        required: false
        default: ''

permissions:
  contents: write

env:
  REF: ${{ inputs.tag || github.ref_name }}

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}
      - name: The tag must match project(VERSION)
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        env:
          TAG: ${{ env.REF }}
        run: |
          project=$(sed -nE 's/^project\(glate VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          if [ "${TAG#v}" != "$project" ]; then
            echo "tag $TAG does not match project(VERSION) $project in CMakeLists.txt" >&2
            exit 1
          fi

  build-windows:
    needs: check-version
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.0'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtmultimedia
          cache: true

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # The offline engine's bundled PCRE2 build declares an old CMake minimum
      # that CMake 4 refuses without this.
      - name: Allow the engine's old CMake minimums
        shell: bash
        run: echo "CMAKE_POLICY_VERSION_MINIMUM=3.5" >> "$GITHUB_ENV"

      - name: Build application
        shell: cmd
        run: |
          rem The engine's bundled PCRE2 is a separate CMake project; without this it picks
          rem the Visual Studio generator and its install step fails under nmake.
          set CMAKE_GENERATOR=NMake Makefiles
          cmake -S . -B build-win -G "NMake Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=%Qt6_DIR% || exit /b 1
          cmake --build build-win || exit /b 1

      - name: Package Windows portable build
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item "build-win\src\glate.exe" -Destination "release\Glate.exe"
          Push-Location release
          windeployqt --release Glate.exe
          Pop-Location
          Compress-Archive -Path "release\*" -DestinationPath "Glate-Portable-${{ env.REF }}-Win64.zip"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: glate-windows
          path: Glate-Portable-${{ env.REF }}-Win64.zip

  release:
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    runs-on: ubuntu-latest
    needs: build-windows

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: glate-windows
          path: release-assets

      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum * > checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.REF }}
          files: |
            release-assets/*
          generate_release_notes: true
          body: |
            ## Glate ${{ env.REF }}

            Automated release artifacts:
            - Windows portable build (`Glate-Portable-...-Win64.zip`)
            - SHA256 checksums (`checksums.txt`)

            Linux: the snap is in the Snap Store's stable channel (`snap install glate`),
            the Flatpak on Flathub (`flatpak install flathub com.ktechpit.glate`).

