# A version tag (v1.2.3) becomes a GitHub release with generated notes
# (DOCS/DECISIONS.md ADR-007). The snap for the tag goes to the stable channel through
# snap.yml; Flathub builds the tag itself through its x-checker-data. There is no Windows
# build in CI (owner, 2026-10-23).
name: release

on:
  push:
    tags:
      - 'v*.*.*'
  # By hand: creates the release of `tag`, for example after a failed run.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, e.g. v1.2.3 (empty: only checks the version)'
        required: false
        default: ''

permissions:
  contents: write

env:
  REF: ${{ inputs.tag || github.ref_name }}

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}
      - name: The tag must match project(VERSION)
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        env:
          TAG: ${{ env.REF }}
        run: |
          project=$(sed -nE 's/^project\(glate VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          if [ "${TAG#v}" != "$project" ]; then
            echo "tag $TAG does not match project(VERSION) $project in CMakeLists.txt" >&2
            exit 1
          fi

  release:
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    runs-on: ubuntu-latest
    needs: check-version

    steps:
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.REF }}
          generate_release_notes: true
          body: |
            ## Glate ${{ env.REF }}

            Linux: the snap is in the Snap Store's stable channel (`snap install glate`),
            the Flatpak on Flathub (`flatpak install flathub com.ktechpit.glate`).

