# Local source build (build-flatpak.sh), fetching the engine over the network.
# The Flathub package (github.com/flathub/com.ktechpit.glate) builds a release tag
# with the engine as pinned archives instead (ADR-001); keep runtime-version in step.
app-id: com.ktechpit.glate
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: glate

finish-args:
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --share=ipc
  - --filesystem=home
  - --talk-name=org.freedesktop.Notifications

cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /share/man

modules:
  - name: glate
    buildsystem: cmake-ninja
    build-options:
      # The configure step fetches Mozilla's translation engine (ADR-003).
      # Allowed for local builds only; Flathub builds have no network.
      build-args:
        - --share=network
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/app
    sources:
      - type: dir
        path: .

